<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Ghana Warehouse Connect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/animations.css">
</head>
<body>
    <header class="header">
        <div class="header-top">
            <div class="container">
                <div class="header-content">
                    <a href="../index.html" class="logo">
                        <span class="logo-icon"><i class="fa-solid fa-warehouse"></i></span>
                        <span class="logo-text">GWC</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="auth-container">
            <div class="auth-card fade-in">
                <h1>Create Account</h1>
                <p class="auth-subtitle">Join Ghana Warehouse Connect today</p>

                <form id="registerForm">
                    <div class="form-group">
                        <label for="regName">Full Name *</label>
                        <input type="text" id="regName" required placeholder="John Doe" autocomplete="name">
                    </div>

                    <div class="form-group">
                        <label for="regEmail">Email Address *</label>
                        <input type="email" id="regEmail" required placeholder="you@example.com" autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label for="regPhone">Phone Number</label>
                        <input type="tel" id="regPhone" placeholder="024XXXXXXX" autocomplete="tel">
                    </div>

                    <div class="form-group">
                        <label for="regRole">Account Type *</label>
                        <select id="regRole" required>
                            <option value="bundle_customer">Bundle Customer</option>
                            <option value="wholesale_customer">Wholesale Customer</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="regPassword">Password *</label>
                            <input type="password" id="regPassword" required placeholder="Min 6 characters" autocomplete="new-password">
                        </div>
                        <div class="form-group">
                            <label for="regConfirmPassword">Confirm Password *</label>
                            <input type="password" id="regConfirmPassword" required placeholder="Re-enter password" autocomplete="new-password">
                        </div>
                    </div>

                    <label class="checkbox" style="margin-bottom: 1rem;">
                        <input type="checkbox" id="agreeTerms" required>
                        I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                    </label>

                    <button type="submit" class="btn btn-primary btn-block btn-lg">Create Account</button>
                </form>

                <div class="auth-footer">
                    Already have an account? <a href="login.html">Login</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Ghana Warehouse Connect. All rights reserved.</p>
        </div>
    </footer>

    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/validation.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (isLoggedIn()) {
                window.location.href = 'profile.html';
                return;
            }
            setupRegisterForm();
            setupRealTimeValidation('registerForm');
        });
    </script>
</body>
</html>
