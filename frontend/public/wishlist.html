<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist - Ghana Warehouse Connect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/animations.css">
</head>
<body>
    <header class="header">
        <div class="header-top">
            <div class="container">
                <div class="header-content">
                    <a href="../index.html" class="logo">
                        <span class="logo-icon"><i class="fa-solid fa-warehouse"></i></span>
                        <span class="logo-text">GWC</span>
                    </a>
                    <div class="search-container">
                        <input type="text" id="searchInput" class="search-input" placeholder="Search..." aria-label="Search">
                        <button class="search-btn" aria-label="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>
                    <div class="header-actions">
                        <a href="profile.html" class="action-link" aria-label="Account"><i class="fa-solid fa-user"></i></a>
                        <a href="wishlist.html" class="action-link active" aria-label="Wishlist"><i class="fa-solid fa-heart"></i></a>
                        <a href="cart.html" class="action-link" aria-label="Cart">
                            <span class="icon"><i class="fa-solid fa-cart-shopping"></i></span>
                            <span class="badge" id="cartCount" style="display:none">0</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <h1><i class="fa-solid fa-heart"></i> My Wishlist</h1>

            <div id="emptyWishlist" class="empty-state" style="display: none;">
                <div class="empty-state-icon"><i class="fa-solid fa-heart fa-3x"></i></div>
                <p>Your wishlist is empty</p>
                <a href="category.html" class="btn btn-primary">Start Shopping</a>
            </div>

            <div class="products-grid" id="wishlistGrid"></div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Ghana Warehouse Connect. All rights reserved.</p>
        </div>
    </footer>

    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/wishlist.js"></script>
    <script src="../js/components.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            displayWishlist();
        });

        function displayWishlist() {
            var wishlist = getWishlist();
            var grid = document.getElementById('wishlistGrid');
            var empty = document.getElementById('emptyWishlist');

            if (wishlist.length === 0) {
                grid.innerHTML = '';
                empty.style.display = 'block';
                return;
            }

            empty.style.display = 'none';
            grid.innerHTML = wishlist.map(function(item) {
                var name = escapeHtml(item.name || 'Product');
                var price = parseFloat(item.price || 0);
                var id = item.id || 0;
                var category = escapeHtml(item.category || 'Uncategorized');
                var isWished = isInWishlist(id);

                return '<div class="product-card">' +
                    '<a href="product_detail.html?id=' + id + '" class="product-image"><div class="image-placeholder"><i class="fa-solid fa-image"></i></div></a>' +
                    '<div class="product-info">' +
                    '<h3 class="product-name"><a href="product_detail.html?id=' + id + '">' + name + '</a></h3>' +
                    '<p class="product-category">' + category + '</p>' +
                    '<div class="product-prices"><span class="price-current">' + formatCurrency(price) + '</span></div>' +
                    '<button class="btn btn-add-cart" onclick="addProductToCart(' + id + ', \'' + name.replace(/'/g, "\\'") + '\', ' + price + ')"><i class="fa-solid fa-cart-shopping"></i> Add to Cart</button>' +
                    '<button class="btn btn-outline" style="margin-top:0.5rem;width:100%;" onclick="removeWishItem(' + id + ')"><i class="fa-solid fa-trash"></i> Remove</button>' +
                    '</div></div>';
            }).join('');
        }

        function removeWishItem(id) {
            removeFromWishlist(id);
            displayWishlist();
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && this.value) window.location.href = 'category.html?search=' + encodeURIComponent(this.value);
        });
        document.querySelector('.search-btn').addEventListener('click', function() {
            var q = document.getElementById('searchInput').value;
            if (q) window.location.href = 'category.html?search=' + encodeURIComponent(q);
        });
    </script>
</body>
</html>
