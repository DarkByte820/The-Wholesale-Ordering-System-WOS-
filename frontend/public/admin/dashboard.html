<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/admin.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="../../css/animations.css">
</head>
<body>
    <div class="admin-layout" id="adminLayout"></div>

    <script src="../../js/utils.js"></script>
    <script src="../../js/app.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/components.js"></script>
    <script src="../../js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (!AdminApp.requireAdmin()) return;

            var content = AdminApp.initLayout('Dashboard', 'dashboard');

            async function loadDashboard() {
                try {
                    var result = await API.getDashboard();
                    if (!result.success) {
                        content.innerHTML = '<div class="empty-state"><div class="empty-state-icon"><i class="fa-solid fa-triangle-exclamation"></i></div><p>Failed to load dashboard</p></div>';
                        return;
                    }
                    var d = result.data;

                    var html = '<div class="stats-grid">';
                    html += '<div class="stat-card"><div class="stat-icon gradient-blue"><i class="fa-solid fa-box"></i></div><div class="stat-info"><span class="stat-number">' + (d.totalProducts || 0) + '</span><span class="stat-label">Products</span></div></div>';
                    html += '<div class="stat-card"><div class="stat-icon gradient-green"><i class="fa-solid fa-clipboard-list"></i></div><div class="stat-info"><span class="stat-number">' + (d.totalOrders || 0) + '</span><span class="stat-label">Total Orders</span></div></div>';
                    html += '<div class="stat-card"><div class="stat-icon gradient-orange"><i class="fa-solid fa-users"></i></div><div class="stat-info"><span class="stat-number">' + (d.totalCustomers || 0) + '</span><span class="stat-label">Customers</span></div></div>';
                    html += '<div class="stat-card"><div class="stat-icon gradient-pink"><i class="fa-solid fa-coins"></i></div><div class="stat-info"><span class="stat-number">GH\u20B5 ' + (d.totalRevenue || 0).toLocaleString() + '</span><span class="stat-label">Revenue</span></div></div>';
                    html += '</div>';

                    html += '<div class="grid-2"><div class="card"><div class="card-header"><h3><i class="fa-solid fa-clock-rotate-left"></i> Recent Orders</h3></div><div class="card-body">';
                    if (d.recentOrders && d.recentOrders.length > 0) {
                        d.recentOrders.forEach(function(o) {
                            html += '<div class="list-item"><div><strong>#' + o.Order_ID + '</strong> - ' + escapeHtml(o.CustomerName || 'Customer') + '</div><div>' + AdminApp.statusBadge(o.Status) + '</div></div>';
                        });
                    } else {
                        html += '<div class="empty-state"><div class="empty-state-icon"><i class="fa-solid fa-inbox"></i></div><p>No recent orders</p></div>';
                    }
                    html += '</div></div>';

                    html += '<div class="card"><div class="card-header"><h3><i class="fa-solid fa-box-open"></i> Low Stock Alert</h3></div><div class="card-body">';
                    if (d.lowStockProducts && d.lowStockProducts.length > 0) {
                        d.lowStockProducts.forEach(function(p) {
                            var stockClass = p.Quantity <= 5 ? 'danger' : 'warning';
                            html += '<div class="list-item"><div>' + escapeHtml(p.Name) + '</div><div><span class="status-badge status-' + stockClass + '">' + p.Quantity + ' left</span></div></div>';
                        });
                    } else {
                        html += '<div class="empty-state"><div class="empty-state-icon"><i class="fa-solid fa-check-circle"></i></div><p>All stock levels healthy</p></div>';
                    }
                    html += '</div></div></div>';

                    content.innerHTML = html;
                } catch (err) {
                    content.innerHTML = '<div class="empty-state"><div class="empty-state-icon"><i class="fa-solid fa-triangle-exclamation"></i></div><p>Error loading dashboard</p></div>';
                }
            }

            loadDashboard();
        });
    </script>
</body>
</html>
