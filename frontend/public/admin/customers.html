<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/admin.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="../../css/animations.css">
</head>
<body>
    <div class="admin-layout" id="adminLayout"></div>

    <script src="../../js/utils.js"></script>
    <script src="../../js/app.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/components.js"></script>
    <script src="../../js/admin.js"></script>
    <script>
        var allCustomers = [];

        document.addEventListener('DOMContentLoaded', function() {
            if (!AdminApp.requireAdmin()) return;
            var content = AdminApp.initLayout('Customers', 'customers');

            var html = '<div class="page-header">';
            html += '<div class="page-header-left"><input type="text" id="searchBox" placeholder="Search customers..." oninput="searchCustomers(this.value)"></div>';
            html += '</div>';
            html += '<div id="customerTable"></div>';
            content.innerHTML = html;

            loadCustomers();
        });

        async function loadCustomers() {
            var result = await API.getWholesaleCustomers();
            if (result.success) allCustomers = result.data || result.customers || [];
            renderTable();
        }

        function renderTable() {
            var search = (document.getElementById('searchBox') ? document.getElementById('searchBox').value : '').toLowerCase();
            var filtered = allCustomers.filter(function(c) {
                return !search || (c.Name || '').toLowerCase().indexOf(search) !== -1 || (c.Email || '').toLowerCase().indexOf(search) !== -1;
            });

            if (filtered.length === 0) {
                document.getElementById('customerTable').innerHTML = '<div class="empty-state"><div class="empty-state-icon"><i class="fa-solid fa-users"></i></div><p>No customers found</p></div>';
                return;
            }

            var html = '<table class="data-table"><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Joined</th></tr></thead><tbody>';
            filtered.forEach(function(c) {
                html += '<tr>';
                html += '<td>#' + c.User_ID + '</td>';
                html += '<td>' + escapeHtml(c.Name) + '</td>';
                html += '<td>' + escapeHtml(c.Email) + '</td>';
                html += '<td>' + escapeHtml(c.Phone || '-') + '</td>';
                html += '<td>' + AdminApp.statusBadge(c.Role) + '</td>';
                html += '<td>' + (c.Created_At || '-') + '</td>';
                html += '</tr>';
            });
            html += '</tbody></table>';
            document.getElementById('customerTable').innerHTML = html;
        }

        function searchCustomers() { renderTable(); }
    </script>
</body>
</html>
