<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ghana Warehouse Connect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/animations.css">
</head>
<body>
    <header class="header">
        <div class="header-top">
            <div class="container">
                <div class="header-content">
                    <a href="../index.html" class="logo">
                        <span class="logo-icon"><i class="fa-solid fa-warehouse"></i></span>
                        <span class="logo-text">GWC</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="auth-container">
            <div class="auth-card fade-in">
                <h1>Welcome Back</h1>
                <p class="auth-subtitle">Sign in to your account</p>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email Address</label>
                        <input type="email" id="loginEmail" required placeholder="you@example.com" autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" required placeholder="Enter your password" autocomplete="current-password">
                    </div>

                    <div style="text-align: right; margin-bottom: 1rem;">
                        <a href="forgot_password.html" style="font-size: 0.9rem; color: var(--primary-color);">Forgot Password?</a>
                    </div>

                    <label class="checkbox" style="margin-bottom: 1rem;">
                        <input type="checkbox" id="rememberMe">
                        Remember me
                    </label>

                    <button type="submit" class="btn btn-primary btn-block btn-lg">Login</button>
                </form>

                <div class="auth-footer">
                    Don't have an account? <a href="register.html">Create one</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Ghana Warehouse Connect. All rights reserved.</p>
        </div>
    </footer>

    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/validation.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (isLoggedIn()) {
                window.location.href = 'profile.html';
                return;
            }
            setupLoginForm();
            setupRealTimeValidation('loginForm');
        });
    </script>
</body>
</html>
