<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Ghana Warehouse Connect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/animations.css">
</head>
<body>
    <header class="header">
        <div class="header-top">
            <div class="container">
                <div class="header-content">
                    <a href="../index.html" class="logo">
                        <span class="logo-icon"><i class="fa-solid fa-warehouse"></i></span>
                        <span class="logo-text">GWC</span>
                    </a>
                    <div class="search-container">
                        <input type="text" class="search-input" placeholder="Search..." aria-label="Search">
                        <button class="search-btn" aria-label="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="checkout-container">
                <div class="step-indicator">
                    <div class="step active" id="step1"><div class="step-number">1</div><div class="step-label">Cart</div></div>
                    <div class="step-line"></div>
                    <div class="step" id="step2"><div class="step-number">2</div><div class="step-label">Address</div></div>
                    <div class="step-line"></div>
                    <div class="step" id="step3"><div class="step-number">3</div><div class="step-label">Payment</div></div>
                    <div class="step-line"></div>
                    <div class="step" id="step4"><div class="step-number">4</div><div class="step-label">Review</div></div>
                </div>

                <div class="checkout-layout">
                    <section class="checkout-content">
                        <div class="checkout-step active" id="checkoutStep1">
                            <h2>Order Items</h2>
                            <div id="cartSummary"></div>
                            <button class="btn btn-primary" onclick="nextStep(2)">Continue to Address</button>
                        </div>

                        <div class="checkout-step" id="checkoutStep2">
                            <h2>Delivery Address</h2>
                            <div class="saved-addresses" id="savedAddresses"></div>
                            <h3>Enter New Address</h3>
                            <form id="addressForm" class="address-form">
                                <div class="form-group">
                                    <label for="fullName">Full Name *</label>
                                    <input type="text" id="fullName" required>
                                </div>
                                <div class="form-group">
                                    <label for="phone">Phone Number *</label>
                                    <input type="tel" id="phone" placeholder="024XXXXXXX" required>
                                </div>
                                <div class="form-group">
                                    <label for="address">Street Address *</label>
                                    <input type="text" id="address" required>
                                </div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="city">City *</label>
                                        <input type="text" id="city" required>
                                    </div>
                                    <div class="form-group">
                                        <label for="region">Region *</label>
                                        <select id="region" required>
                                            <option value="">Select Region</option>
                                            <option value="Greater Accra">Greater Accra</option>
                                            <option value="Ashanti">Ashanti</option>
                                            <option value="Western">Western</option>
                                            <option value="Central">Central</option>
                                            <option value="Eastern">Eastern</option>
                                            <option value="Volta">Volta</option>
                                            <option value="Northern">Northern</option>
                                            <option value="Upper East">Upper East</option>
                                            <option value="Upper West">Upper West</option>
                                            <option value="Brong-Ahafo">Brong-Ahafo</option>
                                            <option value="Western North">Western North</option>
                                            <option value="Ahafo">Ahafo</option>
                                            <option value="Bono East">Bono East</option>
                                            <option value="Oti">Oti</option>
                                            <option value="Savannah">Savannah</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="postal">Postal Code</label>
                                    <input type="text" id="postal">
                                </div>
                                <label class="checkbox">
                                    <input type="checkbox" id="saveAddress">
                                    Save this address for future orders
                                </label>
                            </form>
                            <div class="step-buttons">
                                <button class="btn btn-outline" onclick="prevStep(1)"><i class="fa-solid fa-arrow-left"></i> Back</button>
                                <button class="btn btn-primary" onclick="validateAndNextStep(3)">Continue to Payment</button>
                            </div>
                        </div>

                        <div class="checkout-step" id="checkoutStep3">
                            <h2>Payment Method</h2>
                            <div class="payment-methods">
                                <label class="payment-option">
                                    <input type="radio" name="payment" value="mobile-money" checked>
                                    <div>
                                        <span class="option-title"><i class="fa-solid fa-mobile-screen"></i> Mobile Money</span>
                                        <span class="option-desc">Pay using MTN, Vodafone, or AirtelTigo</span>
                                    </div>
                                </label>
                                <label class="payment-option">
                                    <input type="radio" name="payment" value="card">
                                    <div>
                                        <span class="option-title"><i class="fa-solid fa-credit-card"></i> Credit/Debit Card</span>
                                        <span class="option-desc">Visa, Mastercard, American Express</span>
                                    </div>
                                </label>
                                <label class="payment-option">
                                    <input type="radio" name="payment" value="bank-transfer">
                                    <div>
                                        <span class="option-title"><i class="fa-solid fa-building-columns"></i> Bank Transfer</span>
                                        <span class="option-desc">Direct bank account transfer</span>
                                    </div>
                                </label>
                                <label class="payment-option">
                                    <input type="radio" name="payment" value="cash-on-delivery">
                                    <div>
                                        <span class="option-title"><i class="fa-solid fa-money-bill-wave"></i> Cash on Delivery</span>
                                        <span class="option-desc">Pay when your order arrives</span>
                                    </div>
                                </label>
                            </div>

                            <div id="mobileMoneyForm" class="payment-form">
                                <div class="form-group">
                                    <label>Provider</label>
                                    <select id="momoProvider">
                                        <option value="">Select Provider</option>
                                        <option value="mtn">MTN Mobile Money</option>
                                        <option value="vodafone">Vodafone Cash</option>
                                        <option value="airteltigo">AirtelTigo Money</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Phone Number</label>
                                    <input type="tel" id="momoPhone" placeholder="024XXXXXXX">
                                </div>
                            </div>

                            <div id="cardForm" class="payment-form" style="display: none;">
                                <div class="form-group">
                                    <label>Card Number</label>
                                    <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456">
                                </div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label>Expiry Date</label>
                                        <input type="text" id="cardExpiry" placeholder="MM/YY">
                                    </div>
                                    <div class="form-group">
                                        <label>CVV</label>
                                        <input type="text" id="cardCvv" placeholder="123">
                                    </div>
                                </div>
                            </div>

                            <div class="step-buttons">
                                <button class="btn btn-outline" onclick="prevStep(2)"><i class="fa-solid fa-arrow-left"></i> Back</button>
                                <button class="btn btn-primary" onclick="nextStep(4)">Review Order</button>
                            </div>
                        </div>

                        <div class="checkout-step" id="checkoutStep4">
                            <h2>Review Your Order</h2>
                            <div class="review-section"><h3><i class="fa-solid fa-box-open"></i> Items</h3><div id="reviewItems"></div></div>
                            <div class="review-section"><h3><i class="fa-solid fa-location-dot"></i> Delivery Address</h3><div id="reviewAddress"></div></div>
                            <div class="review-section"><h3><i class="fa-solid fa-credit-card"></i> Payment Method</h3><div id="reviewPayment"></div></div>
                            <div class="review-section"><h3><i class="fa-solid fa-coins"></i> Order Total</h3><div id="reviewTotal"></div></div>
                            <div class="terms-agreement">
                                <label>
                                    <input type="checkbox" id="agreeTerms" required>
                                    I agree to the <a href="#">Terms and Conditions</a> and <a href="#">Return Policy</a>
                                </label>
                            </div>
                            <div class="step-buttons">
                                <button class="btn btn-outline" onclick="prevStep(3)"><i class="fa-solid fa-arrow-left"></i> Back</button>
                                <button class="btn btn-primary btn-lg" onclick="placeOrder()"><i class="fa-solid fa-check"></i> Place Order</button>
                            </div>
                        </div>
                    </section>

                    <aside class="checkout-summary">
                        <h3>Order Summary</h3>
                        <div id="checkoutSummaryContent"></div>
                    </aside>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Ghana Warehouse Connect. All rights reserved.</p>
        </div>
    </footer>

    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/validation.js"></script>

    <script>
        var currentStep = 1;
        var checkoutData = {};

        document.addEventListener('DOMContentLoaded', function() {
            var cart = getCart();
            if (cart.length === 0) {
                showAlert('Your cart is empty', 'error');
                setTimeout(function() { window.location.href = 'cart.html'; }, 1000);
                return;
            }
            displayCheckoutSummary();
            displayCartSummary();
            loadSavedAddresses();
            setupPaymentMethodListeners();
        });

        function displayCheckoutSummary() {
            var summary = JSON.parse(sessionStorage.getItem('orderSummary') || '{}');
            document.getElementById('checkoutSummaryContent').innerHTML =
                '<div class="summary-row"><span>Subtotal</span><span>' + formatCurrency(summary.subtotal || 0) + '</span></div>' +
                '<div class="summary-row"><span>Delivery</span><span>' + formatCurrency(summary.deliveryFee || 0) + '</span></div>' +
                (summary.discount > 0 ? '<div class="summary-row discount"><span>Discount</span><span>-' + formatCurrency(summary.discount) + '</span></div>' : '') +
                '<div class="summary-row total"><span>Total</span><span>' + formatCurrency(summary.total || 0) + '</span></div>';
        }

        function displayCartSummary() {
            var cart = getCart();
            document.getElementById('cartSummary').innerHTML = cart.map(function(item) {
                return '<div class="summary-item"><span>' + escapeHtml(item.name) + ' x ' + item.quantity + '</span><span>' + formatCurrency(item.price * item.quantity) + '</span></div>';
            }).join('');
        }

        function loadSavedAddresses() {
            var addresses = JSON.parse(localStorage.getItem('gwc_savedAddresses') || '[]');
            var container = document.getElementById('savedAddresses');
            if (addresses.length === 0) { container.innerHTML = ''; return; }
            container.innerHTML = '<h3>Saved Addresses</h3>' + addresses.map(function(addr, idx) {
                return '<label class="saved-address"><input type="radio" name="savedAddress" value="' + idx + '" onchange="useSavedAddress(' + idx + ')"><div class="address-info"><strong>' + escapeHtml(addr.fullName) + '</strong><br>' + escapeHtml(addr.address) + ', ' + escapeHtml(addr.city) + '<br>' + escapeHtml(addr.phone) + '</div></label>';
            }).join('');
        }

        function useSavedAddress(idx) {
            var addresses = JSON.parse(localStorage.getItem('gwc_savedAddresses') || '[]');
            var addr = addresses[idx];
            if (!addr) return;
            document.getElementById('fullName').value = addr.fullName || '';
            document.getElementById('phone').value = addr.phone || '';
            document.getElementById('address').value = addr.address || '';
            document.getElementById('city').value = addr.city || '';
            document.getElementById('region').value = addr.region || '';
            document.getElementById('postal').value = addr.postal || '';
        }

        function setupPaymentMethodListeners() {
            document.querySelectorAll('input[name="payment"]').forEach(function(radio) {
                radio.addEventListener('change', function() {
                    document.getElementById('mobileMoneyForm').style.display = 'none';
                    document.getElementById('cardForm').style.display = 'none';
                    if (this.value === 'mobile-money') document.getElementById('mobileMoneyForm').style.display = 'block';
                    else if (this.value === 'card') document.getElementById('cardForm').style.display = 'block';
                });
            });
        }

        function nextStep(step) {
            currentStep = step;
            updateStepIndicator();
            showStep(step);
            if (step === 4) displayReview();
            window.scrollTo(0, 0);
        }

        function prevStep(step) {
            currentStep = step;
            updateStepIndicator();
            showStep(step);
            window.scrollTo(0, 0);
        }

        function showStep(step) {
            for (var i = 1; i <= 4; i++) {
                document.getElementById('checkoutStep' + i).classList.remove('active');
            }
            document.getElementById('checkoutStep' + step).classList.add('active');
        }

        function updateStepIndicator() {
            for (var i = 1; i <= 4; i++) {
                var el = document.getElementById('step' + i);
                if (i <= currentStep) el.classList.add('active');
                else el.classList.remove('active');
            }
        }

        function validateAndNextStep(step) {
            var form = document.getElementById('addressForm');
            if (!form.checkValidity()) {
                showAlert('Please fill all required fields', 'error');
                form.reportValidity();
                return;
            }

            var addressData = {
                fullName: document.getElementById('fullName').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                city: document.getElementById('city').value,
                region: document.getElementById('region').value,
                postal: document.getElementById('postal').value
            };

            var errors = validateAddress(addressData);
            if (errors.length > 0) {
                showAlert(errors[0], 'error');
                return;
            }

            checkoutData.address = addressData;

            if (document.getElementById('saveAddress').checked) {
                var saved = JSON.parse(localStorage.getItem('gwc_savedAddresses') || '[]');
                saved.push(checkoutData.address);
                localStorage.setItem('gwc_savedAddresses', JSON.stringify(saved));
            }

            nextStep(step);
        }

        function displayReview() {
            var cart = getCart();
            document.getElementById('reviewItems').innerHTML = cart.map(function(item) {
                return '<div class="review-item"><span>' + escapeHtml(item.name) + ' x ' + item.quantity + '</span><span>' + formatCurrency(item.price * item.quantity) + '</span></div>';
            }).join('');

            if (checkoutData.address) {
                var a = checkoutData.address;
                document.getElementById('reviewAddress').innerHTML =
                    '<p><strong>' + escapeHtml(a.fullName) + '</strong></p>' +
                    '<p>' + escapeHtml(a.address) + ', ' + escapeHtml(a.city) + '</p>' +
                    '<p>' + escapeHtml(a.region) + (a.postal ? ', ' + escapeHtml(a.postal) : '') + '</p>' +
                    '<p>' + escapeHtml(a.phone) + '</p>';
            }

            var payment = document.querySelector('input[name="payment"]:checked');
            var paymentLabels = { 'mobile-money': 'Mobile Money', 'card': 'Credit/Debit Card', 'bank-transfer': 'Bank Transfer', 'cash-on-delivery': 'Cash on Delivery' };
            document.getElementById('reviewPayment').innerHTML = '<p>' + (paymentLabels[payment.value] || payment.value) + '</p>';

            var summary = JSON.parse(sessionStorage.getItem('orderSummary') || '{}');
            document.getElementById('reviewTotal').innerHTML = '<div class="review-total">' + formatCurrency(summary.total || 0) + '</div>';
        }

        async function placeOrder() {
            if (!document.getElementById('agreeTerms').checked) {
                showAlert('Please agree to Terms and Conditions', 'error');
                return;
            }

            var btn = document.querySelector('#checkoutStep4 .btn-primary');
            btn.disabled = true;
            btn.textContent = 'Placing order...';

            var cart = getCart();
            var summary = JSON.parse(sessionStorage.getItem('orderSummary') || '{}');
            var payment = document.querySelector('input[name="payment"]:checked').value;

            var orderPayload = {
                orderType: 'delivery',
                items: cart.map(function(item) {
                    return { product_id: item.id || item.ProductID, quantity: item.quantity, price: item.price };
                }),
                deliveryAddress: checkoutData.address ? checkoutData.address.address : '',
                deliveryCity: checkoutData.address ? checkoutData.address.city : '',
                customerPhone: checkoutData.address ? checkoutData.address.phone : ''
            };

            var localOrderData = {
                orderId: 'ORD-' + Date.now(),
                items: cart,
                address: checkoutData.address,
                payment: payment,
                total: summary.total || 0,
                status: 'Processing',
                orderDate: new Date().toISOString()
            };

            var orders = JSON.parse(localStorage.getItem('gwc_orders') || '[]');
            orders.push(localOrderData);
            localStorage.setItem('gwc_orders', JSON.stringify(orders));

            if (isLoggedIn()) {
                try {
                    await API.processCheckout(orderPayload);
                } catch (e) {}
            }

            clearCart();
            showAlert('Order placed successfully!', 'success');
            setTimeout(function() {
                window.location.href = 'order-confirmation.html?orderId=' + localOrderData.orderId;
            }, 1500);
        }
    </script>
</body>
</html>
