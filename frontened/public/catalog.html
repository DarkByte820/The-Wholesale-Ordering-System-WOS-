<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Ghana Warehouse Connect</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="logo-icon">🏭</span> GWC
            </a>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="catalog.html" class="nav-link active">Products</a></li>
                <li><a href="cart.html" class="nav-link">🛒 Cart <span id="cartCount" class="cart-badge">0</span></a></li>
                <li><a href="order-tracking.html" class="nav-link">📦 Orders</a></li>
                <li id="profileLink" style="display:none;"><a href="profile.html" class="nav-link">👤 Profile</a></li>
                <li id="loginLink"><a href="login.html" class="nav-link btn-login">Login</a></li>
                <li id="logoutLink" style="display:none;"><a href="#" class="nav-link btn-logout">Logout</a></li>
            </ul>
        </div>
    </nav>

    <!-- Page Content -->
    <div class="container">
        <div class="catalog-header">
            <h1>🛍️ Product Catalog</h1>
            <p>Browse all available products from our warehouse</p>
        </div>

        <!-- Sidebar & Products -->
        <div class="catalog-layout">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="filter-card">
                    <h3>Filters</h3>

                    <div class="filter-group">
                        <label for="categoryFilter">Category</label>
                        <select id="categoryFilter">
                            <option value="">All Categories</option>
                            <option value="Grains">Grains</option>
                            <option value="Oils">Oils</option>
                            <option value="Sweeteners">Sweeteners</option>
                            <option value="Carbohydrates">Carbohydrates</option>
                            <option value="Legumes">Legumes</option>
                            <option value="Dairy">Dairy</option>
                            <option value="Beverages">Beverages</option>
                            <option value="Condiments">Condiments</option>
                            <option value="Spreads">Spreads</option>
                            <option value="Seasonings">Seasonings</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="searchFilter">Search</label>
                        <input 
                            type="text" 
                            id="searchFilter" 
                            placeholder="Search products..."
                        >
                    </div>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="main-content">
                <div id="productsContainer" class="products-grid">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Loading products...</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Ghana Warehouse Connect. All rights reserved.</p>
        </div>
    </footer>

    <script src="../js/app.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/utils.js"></script>

    <script>
        // Load products
        async function loadProducts() {
            const container = document.getElementById('productsContainer');
            const response = await API.getProducts();

            if (response.success) {
                displayProducts(response.data);
            } else {
                container.innerHTML = '<p class="error">Failed to load products</p>';
            }
        }

        function displayProducts(products) {
            const container = document.getElementById('productsContainer');
            container.innerHTML = '';

            if (!products || products.length === 0) {
                container.innerHTML = '<p class="no-results">No products found</p>';
                return;
            }

            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-image">📦</div>
                    <div class="product-info">
                        <h3 class="product-name">${product.Name}</h3>
                        <p class="product-category">${product.Category}</p>
                        <div class="product-price">
                            <span class="unit-price">${formatCurrency(product.UnitPrice)}</span>
                            <span class="wholesale-price">${formatCurrency(product.WholesalePrice)}</span>
                        </div>
                        <button 
                            class="btn btn-sm" 
                            onclick="addToCart(${product.ProductID}, '${product.Name}', ${product.UnitPrice})"
                        >
                            Add to Cart
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Filter & Search
        document.getElementById('categoryFilter').addEventListener('change', filterProducts);
        document.getElementById('searchFilter').addEventListener('input', debounce(filterProducts, 300));

        async function filterProducts() {
            const category = document.getElementById('categoryFilter').value;
            const search = document.getElementById('searchFilter').value;

            if (search.length >= 2) {
                const response = await API.searchProducts(search);
                displayProducts(response.data || []);
            } else if (category) {
                const response = await API.getProducts();
                const filtered = response.data.filter(p => p.Category === category);
                displayProducts(filtered);
            } else {
                loadProducts();
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', loadProducts);
    </script>
</body>
</html>
